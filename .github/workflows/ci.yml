name: CI & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check --output-format=github .

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Format Check
        run: ruff format --check .

  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Pytest
        run: pytest -v

  build-exe:
    name: Build Executable
    needs: [lint, format, test]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "bager_library" `
            --icon "logo.ico" `
            --add-data "assets;assets" `
            --add-data "logo.ico;." `
            --add-data "app_info.json;." `
            --hidden-import jdatetime `
            --hidden-import dotenv `
            main.py

      - name: Build Windows Directory Package (no --onefile) with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "bager_library" `
            --distpath "dist/package" `
            --icon "logo.ico" `
            --add-data "assets;assets" `
            --add-data "logo.ico;." `
            --add-data "app_info.json;." `
            --hidden-import jdatetime `
            --hidden-import dotenv `
            main.py
          Compress-Archive -Path "dist/package/bager_library" -DestinationPath "dist/bager_library-windows-x64.zip" -Force

      - name: Verify Builds Creation
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/bager_library.exe")) {
            Write-Error "dist/bager_library.exe does not exist!"
            exit 1
          }
          if (-not (Test-Path "dist/bager_library-windows-x64.zip")) {
            Write-Error "dist/bager_library-windows-x64.zip does not exist!"
            exit 1
          }
          $exeItem = Get-Item "dist/bager_library.exe"
          $zipItem = Get-Item "dist/bager_library-windows-x64.zip"
          Write-Host "Created binary: $($exeItem.FullName) ($([math]::Round($exeItem.Length / 1MB, 2)) MB)"
          Write-Host "Created onedir zip: $($zipItem.FullName) ($([math]::Round($zipItem.Length / 1MB, 2)) MB)"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bager-library-windows-x64
          path: |
            dist/bager_library.exe
            dist/bager_library-windows-x64.zip
          if-no-files-found: error

  release:
    name: Automatic GitHub Release
    needs: [build-exe]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from app_info.json
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('app_info.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target release version: $VERSION (tag: v$VERSION)"

      - name: Check if tag exists on remote
        id: check_tag
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on remote. Skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist on remote. New release will be created."
          fi

      - name: Download Windows binary artifact
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: bager-library-windows-x64
          path: release-assets

      - name: Create Git Tag and GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          body: |
            ## نسخه جدید کتابخانه باقر العلوم (${{ steps.get_version.outputs.tag }})
            
            این انتشار به‌صورت خودکار پس از بروزرسانی نسخه در شاخه `main` ایجاد شده است.
            
            ### فایل‌های اجرایی:
            - **bager_library.exe**: نسخه تک‌فایلی مستقل برای ویندوز
            - **bager_library-windows-x64.zip**: نسخه پوشه‌ای بدون یکپارچه‌سازی (اجرای سریع‌تر) فشرده‌شده
          files: |
            release-assets/**/bager_library.exe
            release-assets/**/bager_library-windows-x64.zip
          generate_release_notes: true

