[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "relays",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long (handled by formatter and intentional for Persian strings/SQL)
    "E402",  # Module level import not at top of file (load_fonts must execute before widget fonts)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
